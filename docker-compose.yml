services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-training-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitness_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - fitness_training_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_training"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitness_training_pgdata:
